# ============================================================
# Scenario 1 — Single Corridor
# Challenge: Basic navigation, collision avoidance, battery
#             management in a tight linear layout.
# ============================================================

scenario:
  id: 1
  name: "Single Corridor"
  description: >
    Four agents navigate a narrow 8x8 grid with a single
    corridor connecting shelves to one dispatch point.
    Agents must learn not to block each other.

# --- Grid ---
grid:
  width: 8
  height: 8
  # [row, col] coordinates (0-indexed, origin top-left)
  shelves:
    - [1, 1]
    - [1, 2]
    - [1, 3]
    - [6, 1]
    - [6, 2]
    - [6, 3]
  dispatch_points:
    - [3, 7]
  charging_stations:
    - [0, 7]
    - [7, 7]
  obstacles: []  # No extra obstacles in Scenario 1
  agent_start_positions:
    - [3, 0]
    - [4, 0]
    - [3, 1]
    - [4, 1]

# --- Agents ---
agents:
  count: 4
  observation_radius: 2          # Agents see a 5x5 window (radius=2)
  battery_capacity: 50           # Steps before empty
  battery_depletion_per_step: 1  # Lost each step while moving
  battery_charge_per_step: 5     # Gained each step while on charger

# --- Items ---
items:
  spawn_rate: 0.05               # Probability per shelf per step
  max_items_on_shelf: 3

# --- Training ---
training:
  total_episodes: 100_000
  max_steps_per_episode: 200
  eval_interval: 1_000
  checkpoint_interval: 50_000
  weight_init: null              # First scenario, no transfer

# --- Rewards (all weights stored here, never in Python) ---
rewards:
  delivery_reward: 10.0          # +10 per package delivered to dispatch
  pick_up_reward: 1.0            # +1 for picking up an item
  collision_penalty: -2.0        # -2 per collision with another agent or wall
  step_penalty: -0.01            # Small per-step cost encourages efficiency
  battery_empty_penalty: -5.0    # -5 if agent dies from empty battery
  charge_reward: 0.5             # +0.5 per step spent charging (when needed)
  # Anti-reward-hacking: idle agents are penalised the step_penalty even while
  # doing nothing, so staying still indefinitely is never optimal.
