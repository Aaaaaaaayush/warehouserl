server {
    listen 80;
    server_name aayush-warehouserl.duckdns.org localhost;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Static frontend & API Reverse Proxy
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache pre-computed media & trajectory artifacts
    location /logs/ {
        proxy_pass http://web:8000/logs/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /videos/ {
        proxy_pass http://web:8000/videos/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /episodes/ {
        proxy_pass http://web:8000/episodes/;
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
}
